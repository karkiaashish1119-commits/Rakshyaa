<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#18090f">
  <meta name="description" content="A little birthday world made just for Aaru.">
  <title>Happy Birthday, Aaru</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="ambient" aria-hidden="true"></div>
  <main id="experience" aria-label="A birthday surprise for Aaru">
<section class="scene active" aria-label="Birthday reveal">
      <div class="scene-inner reveal-stage">
        <p class="eyebrow">A day worth celebrating</p>
        <p class="lead">Today is a little different...</p>
        <h2>Happy Birthday <span class="heart-drift" aria-hidden="true">♡</span></h2>
        <h1 class="birthday-name">AARU</h1>
        <p class="gold" style="letter-spacing:.3em;font-size:.8rem">KARTHIK 16</p>
        
        <p class="fine">This is just for you.</p>
        <div class="delayed-next"><a class="action" href="why-you.html">Continue <span aria-hidden="true">→</span></a></div>
      </div>
    </section>
  </main>
  <input id="song-upload" class="song-upload-input" type="file" accept="audio/*">
  <label class="song-upload-button" for="song-upload">Add song</label>
  <button class="music-toggle" aria-label="Turn music on" aria-pressed="false" title="Optional music">♫</button>
  <span class="music-note" aria-hidden="true">Music is off</span>
  <audio id="birthday-music" loop preload="none"></audio>

  <script src="script.js"></script>
</body>
</html>
