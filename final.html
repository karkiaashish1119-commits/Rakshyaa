<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#18090f">
  <meta name="description" content="A little birthday world made just for Aaru.">
  <title>Happy Birthday, Aaru</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="ambient" aria-hidden="true"></div>
  <main id="experience" aria-label="A birthday surprise for Aaru">
<section class="scene final-scene active" aria-label="Happy Birthday, Aaru">
      <div class="scene-inner">
        <p class="eyebrow">Made for this little moment</p>
        <h1 class="birthday-name">Happy Birthday,<br>RAKHSHU <span class="heart-drift" aria-hidden="true">🤍</span></h1>
        <div class="final-copy">
          <p>sadhai yestaii ramrii rw hasirakhney hunu</p>
          <p>alik ego xhai kam ghrnu</p>
          <p>You are more special than you probably realize.</p>
        </div>
        <video class="birthday-video" controls playsinline preload="metadata">
          <source src="beaurty.mp4" type="video/mp4">
          Your browser does not support video playback.
        </video>
        <p class="final-date">Karthik 16 <span aria-hidden="true">✨</span></p>
        <a class="action primary replay-button" href="index.html">Replay the surprise <span aria-hidden="true">↻</span></a>
      </div>
    </section>
  </main>
  <button class="music-toggle" aria-label="Turn music on" aria-pressed="false" title="Optional music">♫</button>
  <span class="music-note" aria-hidden="true">Music is off</span>
  <audio id="birthday-music" loop preload="none"></audio>

  <script src="script.js"></script>
</body>
</html>
